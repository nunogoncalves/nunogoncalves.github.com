<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="Profile/stylesheets/style.css?v=4" media="screen">
    <link href='https://fonts.googleapis.com/css?family=Titillium+Web' rel='stylesheet' type='text/css'>
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <title>Nuno Gonçalves</title>
  </head>

  <body>
    <div id="content"></div>

    <script id="profile_template" type="text/x-handlebars-template">
      <main class="profile-page">
        <section class="profile-card" aria-labelledby="profile-name">
          <header class="profile-header">
            <img id="profile-avatar" class="avatar" src="{{avatar_url}}" alt="{{name}}">
            <div class="name_and_title">
              <h1 id="profile-name" class="profile_info">{{name}}</h1>
              <p class="profile_info profile-title">{{title}}</p>
              <p class="profile_info profile-location">{{location}}</p>
            </div>
          </header>

          <nav class="social-links" aria-label="Social links">
            <a class="social-link" href="mailto:{{email}}" aria-label="Email {{name}}">
              <img class="source_icon" src="{{email_url}}" alt="">
              <span class="source-label">Email</span>
            </a>
            {{#each social_sources}}
              <a class="social-link" href="{{link}}" target="_blank" rel="noopener noreferrer" aria-label="{{name}}">
                <img class="source_icon" src="{{image_url}}" alt="">
                <span class="source-label">{{name}}</span>
              </a>
            {{/each}}
          </nav>

          <figure class="featured-video">
            <div class="video-wrapper">
              <iframe width="420" height="236" src="https://www.youtube.com/embed/Tcm8i2sr4eA" title="I've been taking a selfie for 10 years" loading="lazy" allowfullscreen></iframe>
            </div>
            <figcaption class="caption">Life project using custom made tools (iOS and macOS).</figcaption>
          </figure>

          <footer class="project-footer">
            <p class="footer-label">Things I build when I’m curious and want to make life easier</p>
            <nav class="project-links" aria-label="Project links">
              <a class="project-link-card" href="TicTacToeUltimate/" target="_blank" rel="noopener noreferrer">
                <span class="project-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" focusable="false">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path>
                    <path d="m5.5 5.5 2 2m0-2-2 2M16.5 16.5l2 2m0-2-2 2"></path>
                  </svg>
                </span>
                <span class="project-name">Tic Tac Toe</span>
              </a>

              <a class="project-link-card" href="https://nunogoncalves.github.io/StockStalk/" target="_blank" rel="noopener noreferrer">
                <span class="project-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" focusable="false">
                    <path d="M4 19V5M4 19h17"></path>
                    <path d="m6 15 4-4 3 2 5-6"></path>
                    <path d="M15 7h3v3"></path>
                  </svg>
                </span>
                <span class="project-name">StockStalk</span>
              </a>

              <a class="project-link-card" href="LojasDoCidadao/" target="_blank" rel="noopener noreferrer">
                <span class="project-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" focusable="false">
                    <path d="M4 10h16v10H4z"></path>
                    <path d="M3 10 5 4h14l2 6"></path>
                    <path d="M3 10c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2"></path>
                    <path d="M9 20v-5h6v5"></path>
                  </svg>
                </span>
                <span class="project-name">Lojas do Cidadão</span>
              </a>
            </nav>
          </footer>
        </section>
      </main>
    </script>

    <script src="Profile/javascripts/main.js"></script>
    <script src="Profile/javascripts/vendor/handlebars-v4.0.5.js"></script>
    <script>
      (function() {
        loadGoogleAnalytics();
        loadPageTracker();

        var xhttp = new XMLHttpRequest();
        xhttp.open("GET", "Profile/params.json", false);
        xhttp.send();

        var profileJSON = JSON.parse(xhttp.responseText)
        console.log(profileJSON);

        var source = document.getElementById("profile_template").innerHTML;
        var template = Handlebars.compile(source);
        document.getElementById("content").innerHTML = template(profileJSON);
      })();
    </script>

  </body>
</html>
